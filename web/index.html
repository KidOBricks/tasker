<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#161614">
  <meta name="description" content="Tasker — Offline-first tasks, dynamic deadline priority escalation, calendar prep, and cross-device sync.">

  <!-- Web app metadata -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tasker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Tasker — Tasks &amp; Calendar Sync</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: dark;
      --bg: #161614;
      --surface: #1d1d1b;
      --border: rgba(239, 236, 230, 0.1);
      --text: #efece6;
      --muted: #7d7870;
      --accent: #3ca89c;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "IBM Plex Sans", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    ::selection {
      background: rgba(60, 168, 156, 0.28);
      color: var(--text);
    }

    #boot-shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      z-index: 9999;
      transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #boot-shell.ready {
      opacity: 0;
      pointer-events: none;
    }

    .boot-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .boot-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background-color: var(--accent);
    }

    .boot-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--text);
    }

    .boot-sub {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="boot-shell" aria-live="polite" aria-label="Loading Tasker">
    <div class="boot-card">
      <span class="boot-dot"></span>
      <span class="boot-label">Tasker</span>
      <span class="boot-sub">Loading workspace</span>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const shell = document.getElementById('boot-shell');
      if (shell) {
        shell.classList.add('ready');
        setTimeout(() => shell.remove(), 220);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
