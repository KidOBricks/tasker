name: Tasker CI & OCI Release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go PocketBase Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Run Go tests
        run: go test -v ./...
      - name: Build OCI ARM64 binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o tasker-server-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-server-linux-arm64
          path: backend/tasker-server-linux-arm64

  flutter_verify_and_web:
    name: Flutter Analyze, Test & Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build Flutter Web
        run: |
          if [ -n "${{ vars.TASKER_API_URL }}" ]; then
            flutter build web --release --no-web-resources-cdn --dart-define=TASKER_API_URL=${{ vars.TASKER_API_URL }}
          else
            flutter build web --release --no-web-resources-cdn
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-web
          path: build/web

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [flutter_verify_and_web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK
        run: |
          if [ -n "${{ vars.TASKER_API_URL }}" ]; then
            flutter build apk --release --dart-define=TASKER_API_URL=${{ vars.TASKER_API_URL }}
          else
            flutter build apk --release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    needs: [flutter_verify_and_web]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows Release
        shell: pwsh
        run: |
          if ("${{ vars.TASKER_API_URL }}" -ne "") {
            flutter build windows --release --dart-define=TASKER_API_URL=${{ vars.TASKER_API_URL }}
          } else {
            flutter build windows --release
          }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tasker-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-windows-x64
          path: tasker-windows-x64.zip

  deploy_oci:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: [backend, flutter_verify_and_web]
    if: github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tasker-server-linux-arm64
          path: dist/bin
      - uses: actions/download-artifact@v4
        with:
          name: tasker-web
          path: dist/web
      - name: Deploy over SSH to OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts
          chmod +x dist/bin/tasker-server-linux-arm64
          scp -i ~/.ssh/oci_key dist/bin/tasker-server-linux-arm64 "$OCI_USER@$OCI_HOST:/tmp/tasker-server.new"
          rsync -avz --delete -e "ssh -i ~/.ssh/oci_key" dist/web/ "$OCI_USER@$OCI_HOST:/tmp/tasker-web/"
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" "
            sudo mv /tmp/tasker-server.new /opt/tasker/tasker-server &&
            sudo chmod +x /opt/tasker/tasker-server &&
            sudo rsync -a --delete /tmp/tasker-web/ /opt/tasker/web/ &&
            sudo chown -R tasker:tasker /opt/tasker &&
            sudo systemctl restart tasker
          "
