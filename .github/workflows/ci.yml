name: Tasker CI & OCI Release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go PocketBase Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Run Go tests
        run: go test -v ./...
      - name: Build OCI ARM64 binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o tasker-server-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-server-linux-arm64
          path: backend/tasker-server-linux-arm64

  flutter_verify_and_web:
    name: Flutter Analyze, Test & Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build Flutter Web
        run: |
          if [ -n "${{ vars.TASKER_API_URL }}" ]; then
            flutter build web --release --no-web-resources-cdn --dart-define=TASKER_API_URL=${{ vars.TASKER_API_URL }}
          else
            flutter build web --release --no-web-resources-cdn
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-web
          path: build/web

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [flutter_verify_and_web]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Decode Android Release Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "${{ runner.temp }}/tasker-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.available == 'true' && format('{0}/tasker-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          BUILD_ARGS="--release --build-name=$VERSION_NAME --build-number=${{ github.run_number }}"
          if [ -n "${{ vars.TASKER_API_URL }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=TASKER_API_URL=${{ vars.TASKER_API_URL }}"
          fi
          flutter build apk $BUILD_ARGS
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/tasker-v${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.keystore.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK="build/app/outputs/flutter-apk/tasker-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Tasker $TAG" \
              --notes "Automated Android release from commit ${GITHUB_SHA::7}." \
              --latest
          fi

  build_windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    needs: [flutter_verify_and_web]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows Release
        shell: pwsh
        run: |
          if ("${{ vars.TASKER_API_URL }}" -ne "") {
            flutter build windows --release --dart-define=TASKER_API_URL=${{ vars.TASKER_API_URL }}
          } else {
            flutter build windows --release
          }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tasker-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-windows-x64
          path: tasker-windows-x64.zip

  deploy_oci:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: [backend, flutter_verify_and_web]
    if: github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tasker-server-linux-arm64
          path: dist/bin
      - uses: actions/download-artifact@v4
        with:
          name: tasker-web
          path: dist/web
      - name: Deploy over SSH to OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts
          chmod +x dist/bin/tasker-server-linux-arm64
          scp -i ~/.ssh/oci_key dist/bin/tasker-server-linux-arm64 "$OCI_USER@$OCI_HOST:/tmp/tasker-server.new"
          rsync -avz --delete -e "ssh -i ~/.ssh/oci_key" dist/web/ "$OCI_USER@$OCI_HOST:/tmp/tasker-web/"
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" "
            sudo mv /tmp/tasker-server.new /opt/tasker/tasker-server &&
            sudo chmod +x /opt/tasker/tasker-server &&
            sudo rsync -a --delete /tmp/tasker-web/ /opt/tasker/web/ &&
            sudo chown -R tasker:tasker /opt/tasker &&
            sudo systemctl restart tasker
          "
